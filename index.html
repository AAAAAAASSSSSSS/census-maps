<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Census maps</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f1ea;--panel:#fffffff2;--fg:#1c1c1c;--mut:#666;--bd:#d8d3c8;--lk:#0b57d0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171c;--panel:#1d2128f2;--fg:#eceae4;--mut:#9aa0a8;--bd:#363c46;--lk:#8ab4ff}}
:root[data-theme="dark"]{--bg:#14171c;--panel:#1d2128f2;--fg:#eceae4;--mut:#9aa0a8;--bd:#363c46;--lk:#8ab4ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
#map{position:absolute;inset:0;touch-action:none}
.box{position:absolute;background:var(--panel);border:1px solid var(--bd);border-radius:10px;z-index:2}
#panel{left:12px;top:calc(12px + env(safe-area-inset-top,0px));padding:10px 12px;width:min(410px,calc(100% - 100px));max-height:calc(100% - 90px);overflow:auto;box-sizing:border-box}
h1{font-size:15px;margin:0 0 8px;cursor:pointer;display:flex;justify-content:space-between}h1.m{margin:0}
.g{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;align-items:center}.g.h{margin-bottom:4px}#panel.w{width:min(680px,calc(100% - 100px))}
.g button{flex:0 1 auto}.lb{font-size:12px;color:var(--mut);min-width:48px}
button,select{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--bd);border-radius:7px;padding:5px 9px;cursor:pointer}
select{background:var(--panel);width:100%;margin-bottom:8px}button.on{background:var(--fg);color:var(--bg)}.mut{color:var(--mut);font-size:12px;margin-top:6px}
input{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--bd);border-radius:7px;padding:5px 9px;width:100%;box-sizing:border-box}
#tw{max-height:320px;overflow:auto;border:1px solid var(--bd);border-radius:6px;margin-top:6px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:3px 8px;text-align:left;white-space:nowrap}td.r,th.r{text-align:right}th{position:sticky;top:0;background:var(--bg);cursor:pointer;border-bottom:1px solid var(--bd)}tbody tr:nth-child(even) td{background:#8881}
hr{border:0;border-top:1px solid var(--bd);margin:8px 0}
.row{display:grid;grid-template-columns:62px 62px 1fr;gap:6px;align-items:center;margin:3px 0;font-size:12px}
.hd{border:1px solid var(--bd);border-radius:5px;text-align:center;font-size:11px;padding:1px 0}
.sw{height:18px;border-radius:3px;cursor:pointer;border:1px solid #0003}.sw:hover{outline:2px solid var(--fg)}
.bar{height:10px;border-radius:5px;margin:8px 0 2px;background:linear-gradient(90deg,#fde9a8,#f6a05a,#d4462f,#7a1050,#2a0a4a)}
.sp{display:flex;justify-content:space-between;margin:0}
.zl{display:flex;align-items:center;gap:6px;margin:8px 0 2px;font-size:12px}.zs{width:18px;height:12px;border-radius:3px;border:1px solid #0003;flex:none}
#tip{position:absolute;pointer-events:none;z-index:3;background:var(--panel);border:1px solid var(--bd);border-radius:8px;padding:6px 9px;font-size:12px;display:none;max-width:240px}
#ld{left:50%;top:50%;transform:translate(-50%,-50%);padding:10px 16px;display:none;z-index:5}
#lang{right:12px;top:calc(12px + env(safe-area-inset-top,0px));padding:4px}#lang button{display:flex;align-items:center;gap:6px;border:0;width:100%;font-weight:600;font-size:12px}
#lang .menu{display:none;border-top:1px solid var(--bd);margin-top:4px;padding-top:4px}#lang.open .menu{display:block}
#ib{left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:36px;height:36px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--fg)}
#info{left:12px;bottom:calc(58px + env(safe-area-inset-bottom,0px));padding:12px 14px;width:max-content;max-width:calc(100vw - 66px);box-sizing:content-box;display:none}
#info a{color:var(--lk);overflow-wrap:anywhere}
#copy{right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));padding:4px 9px;font-size:11px;color:var(--mut)}
.dd{position:relative;display:block}.ddb{display:flex;justify-content:space-between;align-items:center;width:100%;font-weight:600}.ddb .car{color:var(--mut);transition:transform .15s}.dd.open .car{transform:rotate(180deg)}
.g.h .ddb{padding:11px 11px;min-height:42px}.ddb .ph{font-weight:400}.ddb span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ddm{display:none;position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:6;background:var(--bg);border:1px solid var(--bd);border-radius:9px;padding:4px;box-shadow:0 8px 24px #0004}.dd.open .ddm{display:block;position:static;margin-top:4px;box-shadow:none}
.ddm button{display:flex;justify-content:space-between;width:100%;border:0;text-align:left;padding:7px 9px}.ddm button:hover{background:#8882}.ddm button.on{background:var(--fg);color:var(--bg)}
#sel{right:12px;top:calc(60px + env(safe-area-inset-top,0px));width:min(320px,calc(100% - 24px));max-height:calc(100% - 140px);overflow:auto;padding:10px 12px;box-sizing:border-box;display:none}
#sel .sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}#sel .sh button{border:0;padding:2px 6px;color:var(--mut)}
#sel td:first-child{white-space:normal}#sel tr.cur td{font-weight:700;background:#00c8ff33}#sel tr.ch td:first-child{padding-left:20px}#sel .sub{margin:12px 0 4px}.unn{margin-top:8px;font-size:11px;line-height:1.35}.rn{margin:8px 0;padding:7px 9px;border-left:3px solid #d4a017;background:#d4a01722;border-radius:4px;font-size:12px;line-height:1.4}
#warn{display:none;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 40px));padding:28px 30px;box-sizing:border-box;text-align:center;z-index:5;border:2px solid #d4a017}#warn::before{content:'⚠';display:block;font-size:46px;line-height:1;margin-bottom:10px;color:#d4a017}#warn h2{margin:0 0 12px;font-size:24px;line-height:1.25}#warn p{margin:0 0 14px;font-size:15px;line-height:1.5}#warn .en{font-size:13px;color:var(--mut)}#sel td.l{white-space:normal}#sel tr.gap td{padding:2px;border-bottom:1px solid var(--bd)}#sel tr.tot td{font-weight:700;border-top:1px solid var(--bd)}
#tw.pick tbody tr{cursor:pointer}#tw tbody tr.cur td{background:#00c8ff44}

async function loadRegistry(){const R=await getJSON('data/registry.json');

  if(isG())c.push({k:'y',l:'col_people',r:1,g:p=>{if(nod(p))return '–';const x=p[D.e][gi()];return x<0?'*':fmt(x)},s:p=>nod(p)?-1:gv(p)},{k:'z',l:'col_share',r:1,g:p=>nod(p)?'–':(100*gv(p)/p.p).toFixed(2)+'%',s:p=>nod(p)?-1:gv(p)/p.p});
  return c}
const sk=()=>(cols().find(c=>c.k===S.sort.k)||cols().find(c=>c.k==='p')).k;
function fillTable(){const el=$('tb');if(!el)return;const d=ds(),C=cols(),q=nq(S.q),so=C.find(c=>c.k===sk()),sid=S.selOn&&S.sel?S.sel.properties._i:-1;
  const F=d.data.features.filter(f=>!q||f.properties._q.includes(q)).sort((a,b)=>{const x=so.s(a.properties),y=so.s(b.properties);return(x<y?-1:x>y?1:0)*(S.sort.k===so.k?S.sort.d:-1)});
  el.innerHTML=F.map(f=>`<tr data-i="${f.properties._i}"${f.properties._i===sid?' class="cur"':''}>`+C.map(c=>`<td class="${c.r?'r':''}">${c.g(f.properties)}</td>`).join('')+'</tr>').join('');
  $('cnt').textContent=fmt(F.length)+' / '+fmt(d.data.features.length)}
/* Area details card: full breakdown of one area (all modes except population). The highlighted row is the mapped group / the majority */
function subTable(p,D,pop){if(!p.b||(!pop&&!p.b.some(u=>u[D.e])))return ''; /* no figures below this level (e.g. settlements only have a population) -> no table */
  const g=isG(),n1=u=>u[D.e]?Math.max(0,u[D.e][gi()]||0):0,key=u=>g?n1(u):u.p,srt=a=>a.slice().sort((x,y)=>key(y)-key(x)||y.p-x.p||nm_(x).localeCompare(nm_(y),S.lang==='bg'?'bg':'ro')), /* by the mapped group's count (or population), name breaks ties */
   nmz=u=>tc(nm_(u))+(u.y?' ('+t(u.y==='t'?'k_town':'k_sector')+')':'')+(u.u?' †':''),
   hd=[['col_name'],[pop?'col_pop':g?'col_people':D.cg,pop||g],['col_share',1]],
   cell=u=>pop?[[(u.a?'~':'')+fmt(u.p),1],[(u.a?'~':'')+(100*u.p/p.p).toFixed(2)+'%',1]]:!u[D.e]||(g&&u[D.e][gi()]==null)?[['–',g?1:0],['–',1]]:g?[[u[D.e][gi()]<0?'*':fmt(u[D.e][gi()]),1],[(100*n1(u)/u.p).toFixed(2)+'%',1]]:[[gname(u,D),0],[u[D.s]+'%',1]],
   row=(u,ch)=>`<tr${ch?' class="ch"':''}><td>${nmz(u)}</td>${cell(u).map(([c,r])=>`<td class="${r?'r':'l'}">${c}</td>`).join('')}</tr>`+(u.c?srt(u.c.filter(c=>pop||c[D.e])).map(c=>row(c,1)).join(''):''); /* in the other modes only rows that have figures */
  return `<div class="sub"><b>${p.u?t('sel_parts'):lbl('subs_'+ds().id,t('sel_subs'))}</b> <span class="mut">(${fmt(p.b.length)})</span></div><table><thead><tr>${hd.map(([k,r])=>`<th class="${r?'r':''}">${t(k)}</th>`).join('')}</tr></thead><tbody>${srt(p.b).map(u=>row(u)).join('')}`+
   (pop?`<tr class="tot"><td>${t('sel_total')}</td><td class="r">${fmt(p.p)}</td><td class="r">100%</td></tr>`:'')+'</tbody></table>'}
/* Area details card: full breakdown of one area (all modes except population, which only has a card where the data has a town/village breakdown). The highlighted row is the mapped group / the majority */
function drawSel(){const el=$('sel'),on=hasSel()&&S.selOn;el.style.display=on?'block':'none';if(!on)return;
  const pop=S.view==='pop',D=dm(),p=S.sel&&S.sel.properties;
  let h=`<div class="sh"><b>${t('sel_title')}</b><button data-a="selx" title="${t('sel_close')}">✕</button></div>`;
  if(!p){el.innerHTML=h+`<div class="mut" style="margin:0">${t('sel_hint')}</div>`;return}
  h+=`<div><b>${pn(p)}</b></div><div class="mut" style="margin:0 0 4px">${p.j?tc(jm_(p)):t('ds_'+ds().id)}</div>`;
  if(!pop&&!p[D.e])h+=`<div class="mut">${t('nodata_sel')}</div>`;
  else if(!pop){const nm=NM(D),e=p[D.e],ids=nm.map((_,i)=>i).filter(i=>i!==D.oth&&!D.na.includes(i)&&(!rc()||rc().has(i))).sort((a,b)=>Math.max(0,e[b])-Math.max(0,e[a])||a-b);
    const row=i=>{const v=e[i],x=v==null;return `<tr class="${(isG()?i===gi():p[D.k]==='mix'?tied(p,D).includes(i):i===p[D.w])?'cur':''}"><td>${nm[i]}</td><td class="r">${x?'–':v<0?'*':fmt(v)}</td><td class="r">${x||v<0?'–':(100*v/p.p).toFixed(2)+'%'}</td></tr>`};
    const note=(META[S.cty+'_'+S.cen]||{}).withheld!==false&&(e.some(v=>v<0)||e.reduce((a,v)=>a+Math.max(0,v),0)!==p.p)&&!p.u; /* census files with no withheld values set "withheld":false in meta.json */
    h+=`<table><thead><tr><th>${t(D.ch)}</th><th class="r">${t('col_people')}</th><th class="r">${t('col_share')}</th></tr></thead><tbody>${ids.map(row).join('')}<tr class="gap"><td colspan="3"></td></tr>${row(D.oth)}${D.na.map(row).join('')}
   <tr class="tot"><td>${t('sel_total')}</td><td class="r">${fmt(p.p)}</td><td class="r">100%</td></tr></tbody></table>`+(note?`<div class="mut">${t('sel_note')}</div>`:'')}
  if(pop&&!p.b){const d=ds();h+=`<table><tbody><tr><td>${t('pop')}</td><td class="r">${fmt(p.p)}</td></tr><tr><td>${t('col_nat').replace('{c}',t('c_'+S.cty))}</td><td class="r">${(100*p.p/d.tot).toFixed(3)}%</td></tr></tbody></table>`} /* a unit with no breakdown below it (e.g. Romanian communes): its own population */
  const en=(META[S.cty+'_'+S.cen]||{}).ethNote; /* census-wide note shown under the ethnicity tables (meta.json "ethNote") */
  el.innerHTML=h+subTable(p,D,pop)+(!pop&&D.id==='eth'&&en?`<div class="mut unn">${en[S.lang]||en.en}</div>`:'')+(p.u?notesFor(p,!pop&&isRel()).map(x=>`<div class="mut unn">† ${x}</div>`).join(''):'')}
function fin(){$('info').innerHTML=(S.cty?(t('info_'+S.cty+'_'+S.cen)||'')+'<br>':'')+t('contact'); /* the contact row is the same for every census and is always last */$('ib').title=t('info');$('copy').textContent=t('rights');document.documentElement.lang=S.lang;drawSel();
  const cur=LANGS.find(l=>l.id===S.lang);
  $('lang').innerHTML=`<button data-a="lm">${flag(cur.flag)}${cur.code}</button><div class="menu">${LANGS.filter(l=>l.id!==S.lang).map(l=>`<button data-a="lang" data-k="${l.id}">${flag(l.flag)}${l.code}</button>`).join('')}</div>`}
$('panel').onclick=async e=>{
  const tr=e.target.closest('tr[data-i]');if(tr&&S.selOn&&hasSel()){select(ds().data.features[+tr.dataset.i]);return}
  const b=e.target.closest('[data-a]');if(!b||b.tagName==='SELECT')return;const a=b.dataset.a,k=b.dataset.k;
  if(a==='dd'){b.closest('.dd').classList.toggle('open');return}
  if(a==='min'){S.min=!S.min;return render(false)}
  if(a==='list'){S.list=!S.list;return render(false)}
  if(a==='seltool'){S.selOn=!S.selOn;if(!S.selOn)S.sel=null;return render(false)}
  if(a==='sort'){const c=cols().find(x=>x.k===k);S.sort={k,d:k===sk()?-S.sort.d:(c.t?1:-1)};return render(false)}
  if(a==='cty'){S.cty=k;const cs=CENSUSES.filter(x=>x.country===k);S.cen=cs[cs.length-1].id;S.ds=DS.find(x=>x.country===k&&x.census===S.cen).id;S.sc='lin';S.sel=null}
  else if(a==='cen'){S.cen=k;S.ds=DS.find(x=>x.country===S.cty&&x.census===k).id;S.sc='lin';S.sel=null}
  else if(a==='ds'){S.ds=k;S.sc='lin';S.sel=null}else if(a==='v')S.view=k;else if(a==='sc')S.sc=k;else if(a==='cm')S.cm=k;
  if(a==='cty'||a==='cen'||a==='ds'){const sig=S.cty+S.cen+S.ds;$('ld').textContent=t('loading');$('ld').style.display='block';
    try{await load()}catch(err){console.error(err);$('ld').textContent=t('load_err');setTimeout(()=>$('ld').style.display='none',6000);return}
    $('ld').style.display='none';if(sig!==S.cty+S.cen+S.ds)return}
  render(a!=='sc'&&a!=='cm')};
$('panel').oninput=e=>{if(e.target.id==='q'){S.q=e.target.value;fillTable()}};
$('panel').onchange=e=>{if(e.target.dataset.a==='grp'){S.g[dm().id]=+e.target.value;render(false)}};
$('warn').onclick=e=>{if(e.target.closest('[data-a="notr_back"]')){S.cty=S.cen=S.ds=null;S.sel=null;S.selOn=false;render(true)}};
$('sel').onclick=e=>{if(e.target.closest('[data-a="selx"]')){S.selOn=false;S.sel=null;render(false)}};
document.addEventListener('click',e=>document.querySelectorAll('.dd.open').forEach(d=>{if(!d.contains(e.target))d.classList.remove('open')}));
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.dd.open').forEach(d=>d.classList.remove('open'))});
$('lang').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.a==='lm')$('lang').classList.toggle('open');else{S.lang=b.dataset.k;render(false)}};
$('ib').onclick=()=>{const i=$('info');i.style.display=i.style.display==='block'?'none':'block'};
loadRegistry().then(()=>render(true)).catch(err=>{console.error(err);render(true);$('ld').textContent=t('load_err');$('ld').style.display='block'});
</script></body></html>
